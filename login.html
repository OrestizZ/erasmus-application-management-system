
<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Erasmus+ University of Compton</title>
  <link rel="stylesheet" href="styles/login.css">
  <link rel="stylesheet" href="styles/header.css">
  <script src="scripts/include-header.js"></script>
</head>
<body>
  <div data-include="header.html"></div>

  <main class="main">
    <div class="main-container">
      <div class="form-container">
        <h1>Member Login</h1>
        <form class="login-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="8a_me_diagrapsoun_help">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••">
          </div>
          <button type="submit" class="main-btn"><a href="#">Login</a></button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
