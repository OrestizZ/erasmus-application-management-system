<!-- application.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Form - Erasmus+ University of Compton</title>
  <link rel="stylesheet" href="styles/application.css">
  <link rel="stylesheet" href="styles/header.css">
  <script src="scripts/include-header.js"></script>
</head>
<body>
  <div data-include="header.html"></div>
  <main class="main">
    <div class="main-container">
      <div class="main-contents">
        <div id="admin-period-settings" style="display:none; border: 1px solid #ccc; padding: 10px; margin-bottom: 20px;">
          <h2>Set Application Period</h2>
          <label for="start-date">From:</label>
          <input type="date" id="start-date">
          <label for="end-date">Until:</label>
          <input type="date" id="end-date">
          <button id="save-period" class="main-btn">Submit</button>
          <span id="period-status" style="margin-left: 10px; color: green;"></span>
        </div>

        <span id="login-warning">
        You must be <a href="login.html">logged in</a> to fill out this form.
        </span>

        <span id="period-warning"></span>
        
        <form class="application-form">
          <h1>Application Form</h1>
          <!-- Name fields -->
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" placeholder="Georgios">
          </div>
          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" placeholder="Dilioridis">
          </div>
          <div class="form-group">
            <label for="studentId">Student ID</label>
            <input type="text" id="studentId" name="studentId" placeholder="2022202100047">
          </div>

          <!-- Academic fields -->
          <div class="form-group">
            <label for="passedPercent">Passed Courses (%)</label>
            <input type="number" id="passedPercent" name="passedPercent" min="0" max="100" placeholder="75">
            <span class="error-message" id="passedPercentError"></span>
          </div>
          <div class="form-group">
            <label for="gpa">GPA</label>
            <input type="number" step="0.01" id="gpa" name="gpa" min="0" max="10" placeholder="7.5">
            <span class="error-message" id="gpaError"></span>
          </div>

          <!-- Language proficiency -->
          <fieldset class="form-group radio-group">
            <legend>English Proficiency</legend>
            <label><input type="radio" name="engLevel" value="A1"> A1</label>
            <label><input type="radio" name="engLevel" value="A2"> A2</label>
            <label><input type="radio" name="engLevel" value="B1"> B1</label>
            <label><input type="radio" name="engLevel" value="B2"> B2</label>
            <label><input type="radio" name="engLevel" value="C1"> C1</label>
            <label><input type="radio" name="engLevel" value="C2"> C2</label>
          </fieldset>
          <span class="error-message" id="radioError"></span>

          <!-- University choices -->
          <div class="form-group">
            <label for="uni1">University Choice 1</label>
            <select id="uni1" name="uni1">
              <option value="">Choose University</option>
            </select>
            <span class="error-message" id="uni1Error"></span>
          </div>
          <div class="form-group">
            <label for="uni2">University Choice 2</label>
            <select id="uni2" name="uni2">
              <option value="">Choose University</option>
            </select>
          </div>
          <div class="form-group">
            <label for="uni3">University Choice 3</label>
            <select id="uni3" name="uni3">
              <option value="">Choose University</option>
            </select>
          </div>
          <div class="form-group">
            <label for="gpaUpload">GPA document</label>
            <input type="file" accept=".pdf" name="gpaUpload" id="gpaUpload">
            <span class="error-message" id="gpaUploadError"></span>
          </div>
          <div class="form-group">
            <label for="englishCertificate">English Certificate Document</label>
            <input type="file" accept=".pdf" name="englishCertificate" id="englishCertificate">
            <span class="error-message" id="englishCertificateError"></span>
          </div>
          <div class="form-group">
            <label for="foreignCertificate">Foreign Certificate Document</label>
            <input type="file" accept=".pdf" multiple name="foreignCertificate" id="foreignCertificate">
            <span class="error-message" id="foreignCertificateError"></span>
          </div>

          <!-- Confirmation -->
          <div class="form-group checkbox-group">
            <label><input type="checkbox" name="terms"> I accept the terms and conditions</label>
            <span class="error-message" id="termsError"></span>
          </div>

          <button type="submit" class="main-btn">Submit Application</button>
        </form>
      </div>
    </div>
  </main>
  <script src="scripts/form-access-check.js"></script>
  <script src="scripts/get-universities.js"></script>
  <script src="scripts/application-client-validation.js"></script>
  <script src="scripts/period-settings.js"></script>
</body>
</html>
