<!-- sign-up.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Erasmus+ University of Compton</title>
  <link rel="stylesheet" href="styles/sign-up.css">
  <link rel="stylesheet" href="styles/header.css">
  <script src="scripts/include-header.js"></script>
</head>
<body>
  <div data-include="header.html"></div>

  <main class="main">
    <div class="main-container">
      <div class="main-contents">
        <h1>Create Your Account</h1>
        <form class="signup-form">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" placeholder="Giorgos">
          </div>

          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" placeholder="Dilioridis">
          </div>

          <div class="form-group">
            <label for="studentId">Student ID</label>
            <input type="text" id="studentId" name="studentId" placeholder="2021202200047">
          </div>

          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" placeholder="+30 696 666 1821">
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="dit21047@go.uop.gr">
          </div>

          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="peraste_me_please">
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••">
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••">
          </div>

          <button type="submit" class="main-btn"><a href="#">Sign Up</a></button>
        </form>
      </div>
      <div class="main-img-container">
        <!--<img src="pics&vids/traveler.svg" alt="traveler" id="main-img"> -->
      </div>
    </div>
  </main>
</body>
</html>
