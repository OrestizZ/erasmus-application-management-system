<!-- sign-up.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Erasmus+ University of Compton</title>
  <link rel="stylesheet" href="styles/sign-up.css">
  <link rel="stylesheet" href="styles/header.css">
  <script src="scripts/include-header.js"></script>
  <script src="scripts/is-user-logged-in.js"></script>
</head>
<body>
  <div data-include="header.html"></div>

  <main class="main">
    <div class="main-container">
      <div class="main-contents">
        <div id="successMessage" class="success-message" style="display: none;">
          <h1>Account created!</h1>
          <p>You can now try to <a href="login.html">login</a> to your account.</p>
        </div>
        <h1 class="signup-form-title">Create Your Account</h1>
        <form class="signup-form" method="POST" action="signup.php">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" placeholder="Giorgos" maxlength="50">
            <span class="error-message" id="firstNameError"></span>
          </div>

          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" placeholder="Dilioridis" maxlength="50">
            <span class="error-message" id="lastNameError"></span>
          </div>

          <div class="form-group">
            <label for="studentId">Student ID</label>
            <input type="text" id="studentId" name="studentId" placeholder="2021202200047" maxlength="13">
            <span class="error-message" id="studentIdError"></span>
          </div>

          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" name="phone" placeholder="6966661821" maxlength="10">
            <span class="error-message" id="phoneError"></span>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" name="email" placeholder="dit21047@go.uop.gr" maxlength="50">
            <span class="error-message" id="emailError"></span>
          </div>

          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="peraste_me_please" maxlength="50">
            <span class="error-message" id="usernameError"></span>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-container">
              <input type="password" id="password" name="password" placeholder="••••••••" maxlength="100">
              <span class="toggle-password">👁️</span>
            </div>
            <span class="error-message" id="passwordError"></span>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <div class="password-container">
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" maxlength="100">
              <span class="toggle-password">👁️</span>
            </div>
            <span class="error-message" id="confirmPasswordError"></span>
          </div>

          <button type="submit" class="main-btn">Sign Up</button>

          <span id="login">Already have an account? <a href="login.html">Login.</a></span>
        </form>
      </div>
    </div>
  </main>
  <script src="scripts/sign-up-form-client-validation.js"></script>
  <script src="scripts/signup-form-server-validation.js"></script>
  <script src="scripts/togglePassword.js"></script>
</body>
</html>
