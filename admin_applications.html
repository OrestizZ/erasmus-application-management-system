<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Applications</title>
  <link rel="stylesheet" href="styles/admin_applications.css">
  <link rel="stylesheet" href="styles/header.css">
  <script src="scripts/include-header.js"></script>
</head>
<body>
  <div data-include="header.html"></div>
  <main class="main">
    <div class="main-container">
      <div class="main-contents">
        <h1>All Applications</h1>

        <!-- Filters -->
        <div class="filter-group">
          <label for="minPassRate">Min Pass Rate (%)</label>
          <input type="number" id="minPassRate" min="0" max="100" placeholder="70">

          <label for="universityFilter">University</label>
          <select id="universityFilter">
            <option value="">All</option>
          </select>

          <label>
            <input type="checkbox" id="sortByGPA"> Sort by GPA Desc
          </label>

          <button class="main-btn" id="applyFilters">Apply Filters</button>
        </div>

        <!-- Table -->
        <table id="applicationsTable">
          <thead>
            <tr>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Student ID</th>
              <th>GPA</th>
              <th>Pass %</th>
              <th>English Level</th>
              <th>Uni 1</th>
              <th>Uni 2</th>
              <th>Uni 3</th>
              <th>GPA PDF</th>
              <th>English Cert</th>
              <th>Foreign Cert</th>
              <th>Accepted</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="scripts/admin-applications.js"></script>
</body>
</html>
