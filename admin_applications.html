<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Applications</title>
  <link rel="stylesheet" href="styles/admin_applications.css">
  <link rel="stylesheet" href="styles/header.css">
  <script src="scripts/include-header.js"></script>
  <script src="scripts/is-user-logged-out.js"></script>
  <script src="scripts/is-admin.js"></script>
</head>
<body>
  <div data-include="header.html"></div>
  <main class="main">
    <div class="main-container">
      <div class="main-contents">
        <h1>All Applications</h1>

        <!-- Filters -->
        <div class="filter-group">
          <label for="minPassRate">Min Pass Rate (%)</label>
          <input type="number" id="minPassRate" min="0" max="100" maxlength="3" placeholder="70">

          
          <label for="universityFilter">University</label>
          <select id="universityFilter" name="university">
            <option value="">Choose University</option>
          </select>
            

          <label>
            <input type="checkbox" id="sortByGPA"> Sort by GPA Desc
          </label>

          <button type="submit" class="main-btn" id="applyFilters">Apply Filters</button>
        </div>
        
        <form id="acceptForm">
          <div class="table-wrapper">
          <table id="applicationsTable">
            <thead>
              <tr>
                <th>Accept</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Student ID</th>
                <th>GPA</th>
                <th>Pass %</th>
                <th>English Level</th>
                <th>University_1</th>
                <th>University_2</th>
                <th>University_3</th>
                <th>GPA PDF</th>
                <th>English Cert</th>
                <th>Foreign Cert</th>
                <th>Accepted</th>
                <th>Public</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          </div>
          <button type="submit" id="submitAccept" class="main-btn">Submit Accepted</button>
          <button type="button" id="submitPublic" class="main-btn">Publish Accepted</button>
        </form>

      </div>
    </div>
  </main>
  <script src="scripts/get-universities-admin.js"></script>
  <script src="scripts/admin-applications.js"></script>
</body>
</html>
