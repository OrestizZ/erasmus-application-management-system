<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Αποτελέσματα Erasmus+</title>
</head>
<body>
  <h1>Δεκτοί Φοιτητές Erasmus+</h1>
  <div id="announcement"></div>
  <table border="1" id="resultsTable">
    <thead>
      <tr>
        <th>Όνομα</th><th>Επώνυμο</th><th>ΑΜ</th><th>Μ.Ο.</th><th>% Επιτυχίας</th><th>Αγγλικά</th><th>Πανεπιστήμιο</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    fetch('fetch_accepted.php')
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          document.getElementById('announcement').textContent = data.error;
          return;
        }
        const tbody = document.querySelector('#resultsTable tbody');
        data.forEach(r => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${r.first_name}</td><td>${r.last_name}</td><td>${r.student_id}</td>
            <td>${r.avg_grade}</td><td>${r.pass_rate}%</td><td>${r.english_level}</td><td>${r.university_1}</td>
          `;
          tbody.appendChild(tr);
        });
      });
  </script>
</body>
</html>
